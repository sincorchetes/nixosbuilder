name: Preparar devenv
description: Instala Nix y devenv y comprueba que bun.lock está al día. El resto de pasos se ejecutan con `devenv shell -- <script>`.

runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@v31
    - uses: cachix/cachix-action@v15
      with:
        name: devenv
    - name: Instalar devenv
      shell: bash
      run: nix profile install nixpkgs#devenv
    - name: Dependencias (bun.lock congelado)
      shell: bash
      run: devenv shell -- bun install --frozen-lockfile
