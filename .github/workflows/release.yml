name: Release

# A `v*` tag (v0.0.<n>) publishes a GitHub Release with the packaged site and automatic notes.
# Run manually (Run workflow), it only packages, to test without publishing anything.
# Publishing to GitHub Pages is separate: deploy.yml does it on every merge to main.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package:
    name: Package
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to create the Release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-devenv
      - uses: actions/download-artifact@v4
        with:
          name: indexes
          path: public
      - run: devenv shell -- site-build
        env:
          SITE: ${{ vars.PAGES_SITE || format('https://{0}.github.io', github.repository_owner) }}
          BASE: ${{ vars.PAGES_BASE || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}', github.event.repository.name)) }}
      - name: Zip
        run: |
          name="nixosbuilder-site-${GITHUB_REF_NAME//\//-}"
          (cd dist && zip -qr "../$name.zip" .)
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: release-site
          path: ${{ env.ASSET }}
      - name: Create the Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ASSET" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
