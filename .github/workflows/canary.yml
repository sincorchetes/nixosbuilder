name: NixOS canary

# Every day, evaluates the generated configurations against the current NixOS channels. If a NixOS release
# changes or removes an option (as happened with boot.bootspec on unstable), it opens an issue.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-eval:
    name: Evaluate (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        channel: ['25.11', '26.05', unstable]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- packages
      - run: devenv shell -- nix-eval ${{ matrix.channel }}

  report:
    name: Report failures
    needs: nix-eval
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Canary: generated configurations no longer evaluate on a NixOS channel"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number')
          body="The daily canary failed. Check which channel and which configuration: $RUN_URL"
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug; fi
