name: Secret scan

# Busca secretos (tokens, claves) en todo el historial con gitleaks, ejecutado dentro de devenv.
# Su configuración está en .gitleaks.toml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: un secreto borrado después sigue en el historial
      - uses: ./.github/actions/setup-devenv
      - run: devenv shell -- secrets
