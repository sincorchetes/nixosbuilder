name: Deploy to GitHub Pages

# Publishes on every push to main, manually, and every Monday (to refresh the nixpkgs indexes and catch
# NixOS changes that would break the generated configurations as early as possible).
#
# Optional settings (Settings → Secrets and variables → Actions → Variables):
#   PAGES_SITE  site origin; defaults to https://<owner>.github.io (or your custom domain)
#   PAGES_BASE  base path; defaults to /<repository>/, or / if the repository is <user>.github.io
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build for Pages
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-devenv
      - uses: actions/download-artifact@v8
        with:
          name: indexes
          path: public
      - run: devenv shell -- site-build
        env:
          SITE: ${{ vars.PAGES_SITE || format('https://{0}.github.io', github.repository_owner) }}
          BASE: ${{ vars.PAGES_BASE || (endsWith(github.event.repository.name, '.github.io') && '/' || format('/{0}', github.event.repository.name)) }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
